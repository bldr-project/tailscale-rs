[package]
name = "ts_runtime"
version.workspace = true
description = "tailscale runtime"
categories = ["network-programming"]
keywords = ["tailscale", "runtime"]

repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Our crates, from crates.io: the crates bldr-project patches in only this one, and the
# `tailscale` crate it builds with links against these.
ts_bart = "=0.6.1"
ts_bart_packetfilter = "=0.6.1"
ts_control = "=0.6.1"
ts_dataplane = "=0.6.1"
ts_disco_protocol = "=0.6.1"
ts_keys = "=0.6.1"
ts_netcheck = "=0.6.1"
ts_netmon = "=0.6.1"
ts_netstack_smoltcp = { version = "=0.6.1", features = ["tokio"] }
ts_overlay_router = "=0.6.1"
ts_packet = "=0.6.1"
ts_packetfilter = { version = "=0.6.1", features = ["checking-filter"] }
ts_packetfilter_state = "=0.6.1"
ts_transport = "=0.6.1"
ts_derp = "=0.6.1"
ts_tunnel = "=0.6.1"
ts_hexdump = "=0.6.1"

# Unconditionally required dependencies.
futures.workspace = true
futures-util.workspace = true
ipnet.workspace = true
kameo = "0.21"
kameo_actors = "0.6"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tokio-stream = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true
smallvec.workspace = true
smol_str = "0.3"
yoke.workspace = true
url.workspace = true
rand.workspace = true
bytes.workspace = true
itertools.workspace = true
zerocopy.workspace = true

[dev-dependencies]
chrono.workspace = true
itertools.workspace = true
proptest.workspace = true
tokio-test = "0.4"
ts_capabilityversion = "=0.6.1"

[features]
console = ["kameo/console"]
otel = ["kameo/otel", "kameo/tracing"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["tokio-test"]
